# Render Blueprint: New > Blueprint > pick this repo. Creates the web service.
# The database is Neon Postgres (Render's free Postgres expires after 30 days); its connection
# string is set by hand in the Render dashboard as DATABASE_URL.
# Names are unique on purpose: a Blueprint adopts any existing service with the same name.
services:
  - type: web
    name: farmfresh-flask
    runtime: docker
    plan: free
    region: oregon
    # Deploy a push to main only after its GitHub Actions checks (tests, builds) have passed.
    autoDeployTrigger: checksPass
    healthCheckPath: /api/health
    envVars:
      # Neon connection string (pooled, with sslmode=require). Paste it in the Render dashboard.
      - key: DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      # Your admin login. Set both in the Render dashboard; the account is created on the next deploy.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Payments: leave blank for demo mode, or paste Razorpay TEST keys in the Render dashboard.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
