# Render Blueprint: New > Blueprint > pick this repo. Creates the database and the web service.
databases:
  - name: farmfresh-db
    plan: free
    databaseName: farmfresh
    user: farmfresh

services:
  - type: web
    name: farmfresh
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmfresh-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      # Payments: leave blank for demo mode, or paste Razorpay TEST keys in the Render dashboard.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: DATA_GOV_API_KEY
        sync: false
